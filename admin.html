<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORRIA Studio — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#24211e;--muted:#827a72;--line:#e9e3dc;--paper:#f8f6f2;--white:#fff;--accent:#a8795e;--soft:#f1e9e2;--green:#47765c;--red:#a24c42}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{max-width:390px;margin:12vh auto;background:#fff;padding:34px;border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px #33291b0b}.brand{font-family:Georgia,serif;letter-spacing:.22em;font-size:23px}.eyebrow{font-size:10px;letter-spacing:.19em;color:var(--muted);text-transform:uppercase}.login h1{font:26px Georgia,serif;margin:26px 0 8px}.login p{color:var(--muted);line-height:1.6}
input,select,textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px #a8795e18}textarea{min-height:100px;resize:vertical}
.btn{border:1px solid var(--ink);background:var(--ink);color:white;border-radius:8px;padding:10px 15px;font-weight:600}.btn:hover{opacity:.88}.btn.light{background:white;color:var(--ink);border-color:var(--line)}.btn.soft{background:var(--soft);color:#79553f;border-color:var(--soft)}.btn.danger{background:#fff;color:var(--red);border-color:#e8cbc7}.btn.small{padding:7px 10px;font-size:12px}
.layout{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{background:#25221f;color:#f7f3ee;padding:26px 17px;display:flex;flex-direction:column;gap:28px}.side-brand{padding:4px 12px 22px;border-bottom:1px solid #ffffff20}.side-brand .brand{font-size:22px}.side-brand small{display:block;color:#b9afa6;margin-top:8px;letter-spacing:.15em;font-size:9px}.nav-label{font-size:9px;color:#a99e94;letter-spacing:.18em;padding:0 12px 8px;text-transform:uppercase}.nav-btn{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:#d7d0c8;text-align:left;padding:11px 12px;border-radius:8px;margin:2px 0}.nav-btn:hover,.nav-btn.active{background:#ffffff14;color:#fff}.nav-btn.active{box-shadow:inset 2px 0 #d0a88e}.nav-icon{width:18px;text-align:center;color:#d0a88e}.side-bottom{margin-top:auto;border-top:1px solid #ffffff20;padding-top:17px}.main{min-width:0}.topbar{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:4}.top-title{font:20px Georgia,serif}.top-right{display:flex;align-items:center;gap:13px;color:var(--muted);font-size:12px}.avatar{width:32px;height:32px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:#76523d;font-weight:700}
.content{padding:30px 34px;max-width:1500px;margin:auto}.welcome{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;margin-bottom:25px}.welcome h1{font:30px Georgia,serif;margin:7px 0}.welcome p{color:var(--muted);margin:0}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.panel,.stat{background:#fff;border:1px solid var(--line);border-radius:13px}.stat{padding:19px}.stat-head{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.stat-value{font:28px Georgia,serif;margin:13px 0 4px}.stat-note{font-size:11px;color:var(--muted)}.panel{padding:20px;margin-bottom:18px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}.panel-head h2,.section-title{font:20px Georgia,serif;margin:0}.muted{color:var(--muted)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:600;padding:11px;border-bottom:1px solid var(--line)}td{padding:12px 11px;border-bottom:1px solid #f0ece7;font-size:12px}tr:last-child td{border-bottom:0}.product-cell{display:flex;align-items:center;gap:11px;min-width:180px}.thumb{width:44px;height:44px;object-fit:cover;border-radius:8px;background:var(--soft)}.pill{display:inline-block;padding:5px 8px;border-radius:20px;font-size:10px;background:#f2eee9;color:#6d6259}.pill.green{background:#eaf2ec;color:var(--green)}.pill.red{background:#f8eae8;color:var(--red)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:11px;font-weight:700;color:#655d55}.span2{grid-column:1/-1}.form-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}.gallery-preview{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.gallery-preview img{width:76px;height:76px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}.empty{padding:35px;text-align:center;color:var(--muted)}.notice{padding:11px 13px;border-radius:8px;background:#f3eee8;color:#76553f;font-size:12px;margin:12px 0}.msg{font-size:12px;margin-top:12px}.msg.ok{color:var(--green)}.msg.bad{color:var(--red)}.mobile-menu{display:none}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:fixed;z-index:8;left:-260px;top:0;bottom:0;width:248px;transition:left .2s}.sidebar.open{left:0}.mobile-menu{display:inline-flex}.topbar{padding:0 18px}.content{padding:23px 18px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.stats{gap:9px}.stat{padding:14px}.stat-value{font-size:23px}.welcome{align-items:flex-start;flex-direction:column}.form-grid{grid-template-columns:1fr}.span2{grid-column:auto}.top-title{font-size:17px}.topbar{height:64px}.content{padding:18px 13px}.panel{padding:14px}}
</style></head><body><div id="app"></div>
<script>
"use strict";
const SUPABASE_URL="https://kuvaxkdhfxzznzidaugv.supabase.co", KEY="sb_publishable_PiB7aj8bDrfwAjAyDz2I9g_5t9wdtTk";
const sb=window.supabase.createClient(SUPABASE_URL,KEY), app=document.getElementById("app");
let currentUser=null, activePage="overview";
const $=id=>document.getElementById(id), esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=v=>"₹"+Number(v||0).toLocaleString("en-IN");
function login(){app.innerHTML='<div class="login"><div class="brand">ORRIA</div><div class="eyebrow">Store management</div><h1>Welcome back</h1><p>Sign in to manage your storefront, products and orders.</p><div class="field"><label>ADMIN EMAIL</label><input id="email" type="email" placeholder="you@orria.com"></div><div class="field" style="margin-top:13px"><label>PASSWORD</label><input id="password" type="password" placeholder="Enter password"></div><button class="btn" style="width:100%;margin-top:18px" onclick="doLogin()">Sign in to ORRIA Studio</button><div id="loginMsg" class="msg"></div></div>'}
async function doLogin(){const m=$("loginMsg");m.textContent="Signing in…";const {data,error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error){m.className="msg bad";m.textContent=error.message;return}await boot()}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){login();return}const {data,error}=await sb.from("storefront_admins").select("email").eq("email",session.user.email).maybeSingle();if(error||!data){await sb.auth.signOut();login();$("loginMsg").textContent="This account is not authorized.";return}currentUser=session.user;renderShell();overview()}
async function logout(){await sb.auth.signOut();currentUser=null;login()}
function renderShell(){app.innerHTML='<div class="layout"><aside class="sidebar" id="sidebar"><div class="side-brand"><div class="brand">ORRIA</div><small>ADMINISTRATION STUDIO</small></div><div><div class="nav-label">Workspace</div><button class="nav-btn active" data-page="overview" onclick="navigate(\'overview\')"><span class="nav-icon">◫</span>Overview</button><button class="nav-btn" data-page="products" onclick="navigate(\'products\')"><span class="nav-icon">▧</span>Products</button><button class="nav-btn" data-page="categories" onclick="navigate(\'categories\')"><span class="nav-icon">▦</span>Categories</button><button class="nav-btn" data-page="orders" onclick="navigate(\'orders\')"><span class="nav-icon">▤</span>Orders</button><button class="nav-btn" data-page="coupons" onclick="navigate(\'coupons\')"><span class="nav-icon">％</span>Coupons & offers</button></div><div class="side-bottom"><button class="nav-btn" onclick="location.href=\'index.html\'"><span class="nav-icon">↗</span>View storefront</button><button class="nav-btn" onclick="logout()"><span class="nav-icon">⇥</span>Sign out</button></div></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="btn light mobile-menu" onclick="toggleMenu()">☰</button><div class="top-title" id="pageTitle">Overview</div></div><div class="top-right"><span>ORRIA Store</span><span class="avatar">'+esc((currentUser.email||"O").charAt(0).toUpperCase())+'</span></div></header><section class="content" id="view"></section></main></div>'}
function toggleMenu(){$("sidebar").classList.toggle("open")}
function navigate(page){activePage=page;document.querySelectorAll(".nav-btn[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));$("pageTitle").textContent=({overview:"Overview",products:"Products",categories:"Categories",orders:"Orders",coupons:"Coupons & offers"})[page];$("sidebar").classList.remove("open");({overview,products,categories,orders,coupons})[page]()}
function welcome(title,desc,action=""){return '<div class="welcome"><div><div class="eyebrow">ORRIA / '+esc(activePage)+'</div><h1>'+title+'</h1><p>'+desc+'</p></div>'+action+'</div>'}
async function overview(){const [p,o,c]=await Promise.all([sb.from("products").select("id,active",{count:"exact"}),sb.from("orders").select("id,total,status,payment_status,created_at").order("created_at",{ascending:false}).limit(100),sb.from("coupons").select("id,active",{count:"exact"})]);const products=p.data||[],orders=o.data||[];const paid=orders.filter(x=>String(x.payment_status||"").toLowerCase()==="paid");const revenue=paid.reduce((n,x)=>n+Number(x.total||0),0);$("view").innerHTML=welcome("Good to see you","Here is what is happening across your store today.",'<button class="btn" onclick="navigate(\'products\')">＋ Add product</button>')+'<div class="stats"><div class="stat"><div class="stat-head">Total products <span>▧</span></div><div class="stat-value">'+(p.count??products.length)+'</div><div class="stat-note">In your catalogue</div></div><div class="stat"><div class="stat-head">Total orders <span>▤</span></div><div class="stat-value">'+orders.length+'</div><div class="stat-note">Latest 100 orders</div></div><div class="stat"><div class="stat-head">Paid revenue <span>₹</span></div><div class="stat-value">'+money(revenue)+'</div><div class="stat-note">Based on paid status only</div></div><div class="stat"><div class="stat-head">Active coupons <span>％</span></div><div class="stat-value">'+(c.count??0)+'</div><div class="stat-note">Configured offers</div></div></div><div class="panel"><div class="panel-head"><h2>Recent orders</h2><button class="btn light small" onclick="navigate(\'orders\')">View all</button></div><div class="table-wrap">'+orderTable(orders.slice(0,6))+'</div></div><div class="notice">Revenue counts only orders marked as paid. Order list is limited to the latest 100 records for this dashboard.</div>'}
function orderTable(rows){if(!rows.length)return '<div class="empty">No orders have been placed yet.</div>';return '<table><thead><tr><th>Order</th><th>Customer</th><th>Date</th><th>Total</th><th>Payment</th><th>Status</th></tr></thead><tbody>'+rows.map(o=>'<tr><td><b>'+esc(o.order_number||String(o.id).slice(0,8))+'</b></td><td>'+esc(o.customer_name)+'</td><td>'+new Date(o.created_at).toLocaleDateString("en-IN")+'</td><td>'+money(o.total)+'</td><td><span class="pill '+(String(o.payment_status).toLowerCase()==="paid"?"green":"")+'">'+esc(o.payment_status)+'</span></td><td>'+esc(o.status)+'</td></tr>').join("")+'</tbody></table>'}
async function products(){const [r,c]=await Promise.all([sb.from("products").select("id,name,price,mrp,stock,active,image_url,category_id").order("created_at",{ascending:false}),sb.from("categories").select("id,name").order("name")]);if(r.error){$("view").innerHTML='<div class="panel">Could not load products: '+esc(r.error.message)+'</div>';return}const cats=Object.fromEntries((c.data||[]).map(x=>[x.id,x.name]));$("view").innerHTML=welcome("Products","Manage product information, pricing, stock and product imagery.",'<button class="btn" onclick="productForm()">＋ Add product</button>')+'<div class="panel"><div class="panel-head"><h2>Catalogue <span class="muted">('+r.data.length+')</span></h2><input id="productSearch" style="max-width:240px" placeholder="Search products…" oninput="filterProducts()"></div><div class="table-wrap"><table id="productsTable"><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Visibility</th><th></th></tr></thead><tbody>'+r.data.map(p=>'<tr data-search="'+esc((p.name+" "+(cats[p.category_id]||"")).toLowerCase())+'"><td><div class="product-cell"><img class="thumb" src="'+esc(p.image_url||"")+'" onerror="this.style.visibility=\'hidden\'"><b>'+esc(p.name)+'</b></div></td><td>'+esc(cats[p.category_id]||"—")+'</td><td>'+money(p.price)+'<div class="muted" style="font-size:10px">MRP '+money(p.mrp)+'</div></td><td>'+Number(p.stock||0)+'</td><td><span class="pill '+(p.active?"green":"red")+'">'+(p.active?"Visible":"Hidden")+'</span></td><td><button class="btn light small" onclick="productForm(\''+p.id+'\')">Edit</button></td></tr>').join("")+'</tbody></table></div></div>'}
function filterProducts(){const q=$("productSearch").value.toLowerCase();document.querySelectorAll("#productsTable tbody tr").forEach(tr=>tr.classList.toggle("hidden",!tr.dataset.search.includes(q)))}
async function productForm(id){let p={name:"",price:0,mrp:0,stock:0,image_url:"",description:"",category_id:"",gallery:[]};if(id){const {data,error}=await sb.from("products").select("*").eq("id",id).single();if(error){alert(error.message);return}p={...p,...data};const g=await sb.from("product_images").select("image_url,sort_order").eq("product_id",id).order("sort_order");if(g.error){alert("Gallery load failed: "+g.error.message);return}p.gallery=(g.data||[]).map(x=>x.image_url)}const {data:cats}=await sb.from("categories").select("id,name").order("name");$("view").innerHTML=welcome(id?"Edit product":"Add a product","Enter accurate product details. Use genuine ORRIA product photography only.")+'<div class="panel"><form id="productForm"><div class="form-grid"><div class="field"><label>PRODUCT NAME</label><input id="pn" required value="'+esc(p.name)+'"></div><div class="field"><label>CATEGORY</label><select id="pc" required><option value="">Choose category</option>'+(cats||[]).map(c=>'<option value="'+c.id+'" '+(c.id===p.category_id?"selected":"")+'>'+esc(c.name)+'</option>').join("")+'</select></div><div class="field"><label>SELLING PRICE (₹)</label><input id="pp" type="number" min="0" required value="'+Number(p.price||0)+'"></div><div class="field"><label>MRP (₹)</label><input id="pm" type="number" min="0" value="'+Number(p.mrp||0)+'"></div><div class="field"><label>AVAILABLE STOCK</label><input id="ps" type="number" min="0" value="'+Number(p.stock||0)+'"></div><div class="field"><label>VISIBILITY</label><select id="pa"><option value="true" '+(p.active?"selected":"")+' >Visible on store</option><option value="false" '+(!p.active?"selected":"")+' >Hidden</option></select></div><div class="field span2"><label>MAIN IMAGE URL</label><input id="pi" type="url" placeholder="https://…" value="'+esc(p.image_url)+'"></div><div class="field span2"><label>ADDITIONAL IMAGE URLS — ONE PER LINE</label><textarea id="pg" placeholder="https://image-1…&#10;https://image-2…">'+esc(p.gallery.join("\n"))+'</textarea><div class="muted" style="font-size:11px">Direct image URLs only for now. File upload will be enabled after a dedicated product-images storage bucket and access rules are configured.</div><div id="galleryPreview" class="gallery-preview"></div></div><div class="field span2"><label>PRODUCT DESCRIPTION</label><textarea id="pd">'+esc(p.description)+'</textarea></div></div><div class="form-actions"><button class="btn" type="submit">Save product</button><button class="btn light" type="button" onclick="navigate(\'products\')">Cancel</button></div><div id="saveMsg" class="msg"></div></form></div>';const preview=()=>{const urls=[ $("pi").value.trim(),...$("pg").value.split(/\r?\n/).map(x=>x.trim())].filter(Boolean);$("galleryPreview").innerHTML=urls.map(u=>'<img src="'+esc(u)+'" onerror="this.style.opacity=.2" alt="Image preview">').join("")};$("pi").addEventListener("input",preview);$("pg").addEventListener("input",preview);preview();$("productForm").onsubmit=async e=>{e.preventDefault();const msg=$("saveMsg");const urls=[ $("pi").value.trim(),...$("pg").value.split(/\r?\n/).map(x=>x.trim())].filter(Boolean);const unique=[...new Set(urls)];const invalid=unique.filter(u=>{try{return !["http:","https:"].includes(new URL(u).protocol)}catch{return true}});if(invalid.length){msg.className="msg bad";msg.textContent="Every image must be a valid http or https URL.";return}if(Number($("pm").value||0)<Number($("pp").value||0)){msg.className="msg bad";msg.textContent="MRP should not be lower than selling price.";return}const row={name:$("pn").value.trim(),slug:$("pn").value.trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""),category_id:$("pc").value,price:Number($("pp").value),mrp:Number($("pm").value||0),stock:Number($("ps").value||0),active:$("pa").value==="true",image_url:$("pi").value.trim()||null,description:$("pd").value.trim()||null,updated_at:new Date().toISOString()};const saved=id?await sb.from("products").update(row).eq("id",id).select("id").single():await sb.from("products").insert(row).select("id").single();if(saved.error){msg.className="msg bad";msg.textContent=saved.error.message;return}const pid=saved.data.id;const del=await sb.from("product_images").delete().eq("product_id",pid);if(del.error){msg.className="msg bad";msg.textContent="Product saved, but gallery update failed: "+del.error.message;return}if(unique.length){const ins=await sb.from("product_images").insert(unique.map((image_url,sort_order)=>({product_id:pid,image_url,sort_order})));if(ins.error){msg.className="msg bad";msg.textContent="Product saved, but gallery save failed: "+ins.error.message;return}}msg.className="msg ok";msg.textContent="Product and gallery saved.";setTimeout(()=>navigate("products"),700)}}
async function categories(){const [r,p]=await Promise.all([sb.from("categories").select("*").order("name"),sb.from("products").select("category_id")]);if(r.error){$("view").innerHTML='<div class="panel">'+esc(r.error.message)+'</div>';return}const counts={};(p.data||[]).forEach(x=>counts[x.category_id]=(counts[x.category_id]||0)+1);$("view").innerHTML=welcome("Categories","Review the categories currently connected to your product catalogue.")+'<div class="panel"><div class="table-wrap"><table><thead><tr><th>Category</th><th>Products</th><th>Slug</th><th>Created</th></tr></thead><tbody>'+r.data.map(c=>'<tr><td><b>'+esc(c.name)+'</b></td><td>'+Number(counts[c.id]||0)+'</td><td>'+esc(c.slug)+'</td><td>'+new Date(c.created_at).toLocaleDateString("en-IN")+'</td></tr>').join("")+'</tbody></table></div><div class="notice">Category creation and deletion are intentionally not enabled in this first redesign to avoid changing storefront taxonomy accidentally.</div></div>'}
async function orders(){const {data,error}=await sb.from("orders").select("id,order_number,customer_name,phone,email,address_snapshot,delivery_address,subtotal,discount,shipping,total,status,payment_status,created_at").order("created_at",{ascending:false}).limit(200);if(error){$("view").innerHTML='<div class="panel">Orders could not load: '+esc(error.message)+'</div>';return}const rows=(data||[]).map(o=>'<tr><td><b>'+esc(o.order_number)+'</b><div class="muted">'+new Date(o.created_at).toLocaleString("en-IN")+'</div></td><td>'+esc(o.customer_name)+'<div class="muted">'+esc(o.phone)+'</div></td><td>'+money(o.total)+'</td><td><span class="pill '+(String(o.payment_status).toLowerCase()==="paid"?"green":"")+'">'+esc(o.payment_status)+'</span></td><td><select id="status-'+o.id+'" style="min-width:130px">'+["Pending","Confirmed","Packed","Shipped","Delivered","Cancelled"].map(s=>'<option '+(s===o.status?"selected":"")+'>'+s+'</option>').join("")+'</select></td><td><button class="btn light small" onclick="saveOrderStatus(\\''+o.id+'\\')">Save</button></td></tr>').join("");$("view").innerHTML=welcome("Orders","Review customer purchases and update fulfilment status.")+'<div class="panel"><div class="table-wrap">'+(rows?'<table><thead><tr><th>Order</th><th>Customer</th><th>Amount</th><th>Payment</th><th>Fulfilment</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>':'<div class="empty">No orders have been placed yet.</div>')+'</div></div>'}
async function saveOrderStatus(id){const status=$("status-"+id).value;const {error}=await sb.from("orders").update({status,updated_at:new Date().toISOString()}).eq("id",id);if(error)alert(error.message);else alert("Order status updated.")}
async function coupons(){const {data,error}=await sb.from("coupons").select("*").order("created_at",{ascending:false});if(error){$("view").innerHTML='<div class="panel">'+esc(error.message)+'</div>';return}$("view").innerHTML=welcome("Coupons & offers","Manage coupon codes and their validity.")+'<div class="panel"><div class="panel-head"><h2>Current coupons</h2></div><div class="table-wrap"><table><thead><tr><th>Code</th><th>Minimum order</th><th>Discount</th><th>Validity</th><th>Status</th></tr></thead><tbody>'+(data||[]).map(c=>'<tr><td><b>'+esc(c.code)+'</b></td><td>'+money(c.minimum_order)+'</td><td>'+money(c.discount_amount)+'</td><td>'+(c.starts_at?new Date(c.starts_at).toLocaleDateString("en-IN"):"Anytime")+' – '+(c.ends_at?new Date(c.ends_at).toLocaleDateString("en-IN"):"No end date")+'</td><td><span class="pill '+(c.active?"green":"red")+'">'+(c.active?"Active":"Disabled")+'</span></td></tr>').join("")+'</tbody></table></div><div class="notice">Coupon create/edit is not enabled in this redesign yet. The existing coupon schema is preserved; server-side checkout validation still needs to be implemented before offers are treated as secure.</div></div>'}
boot();
</script></body></html>
