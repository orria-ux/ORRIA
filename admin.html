<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORRIA Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f5f0;color:#171717}.top{background:#fff;border-bottom:1px solid #ddd;padding:16px 22px;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1200px;margin:auto;padding:22px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}button{border:1px solid #222;background:#222;color:#fff;padding:10px 14px;cursor:pointer}button.alt{background:#fff;color:#222}.card{background:#fff;border:1px solid #ddd;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat b{display:block;font-size:24px;margin-top:5px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select,textarea{width:100%;padding:11px;border:1px solid #ccc}textarea{min-height:90px;grid-column:1/-1}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}.login{max-width:380px;margin:12vh auto;background:#fff;border:1px solid #ddd;padding:26px}.login input{margin:10px 0 14px}.msg{font-size:12px;margin-top:10px}.ok{color:#276738}.bad{color:#9a3026}@media(max-width:700px){.grid,.form{grid-template-columns:1fr}.form textarea{grid-column:auto}}
</style></head><body><div id="app"></div><script>
"use strict";
const SUPABASE_URL="https://kuvaxkdhfxzznzidaugv.supabase.co", KEY="sb_publishable_PiB7aj8bDrfwAjAyDz2I9g_5t9wdtTk"; const appEl=document.getElementById("app"); const sbReady=!!window.supabase; const sb=sbReady?window.supabase.createClient(SUPABASE_URL,KEY):null; let session=null;
const $=id=>document.getElementById(id), esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':'&quot;',"'":"&#39;"}[m]));
async function boot(){const r=await sb.auth.getSession();session=r.data.session;if(session)dash();else login();}
function login(){appEl.innerHTML=`<div class="login"><h2>ORRIA Admin</h2><p>Sign in with the Supabase admin user.</p><input id="email" type="email" placeholder="Admin email"><input id="pw" type="password" placeholder="Password"><button onclick="doLogin()">LOGIN</button><div id="msg" class="msg"></div></div>`}
async function doLogin(){if(!sb){msgSafe("Supabase connection unavailable.",true);return} msg.textContent="Signing in…";const {data,error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:pw.value});if(error){msg.className="msg bad";msg.textContent=error.message;return}session=data.session;dash()}
async function logout(){await sb.auth.signOut();session=null;login()}
function shell(content){appEl.innerHTML=`<div class="top"><b>ORRIA ADMIN</b><button class="alt" onclick="logout()">LOGOUT</button></div><div class="wrap"><div class="nav"><button onclick="dash()">Dashboard</button><button onclick="productsPage()">Products</button><button onclick="ordersPage()">Orders</button><button onclick="couponsPage()">Coupons</button><button class="alt" onclick="location.href='index.html'">STORE</button></div>${content}</div>`}
async function dash(){const [p,o,c]=await Promise.all([sb.from('products').select('id',{count:'exact',head:true}),sb.from('orders').select('id,total,status'),sb.from('coupons').select('id',{count:'exact',head:true})]);const orders=o.data||[];const value=orders.reduce((a,x)=>a+Number(x.total||0),0);shell(`<div class="grid"><div class="card stat">Products<b>${p.count||0}</b></div><div class="card stat">Orders<b>${orders.length}</b></div><div class="card stat">Pending<b>${orders.filter(x=>x.status==='Pending').length}</b></div><div class="card stat">Order value<b>₹${value.toLocaleString('en-IN')}</b></div></div><div class="card"><button onclick="productForm()">+ ADD PRODUCT</button> <button class="alt" onclick="couponsPage()">COUPONS</button></div>`)}
async function productsPage(){
 const r=await sb.from('products').select('id,name,price,mrp,stock,active,category_id').order('created_at',{ascending:false});
 if(r.error)return shell(`<div class="card"><b>Products load error:</b> ${esc(r.error.message)}<br><br>Check that products table exists and Policies were run.</div>`);
 const cr=await sb.from('categories').select('id,name'); const cats={}; (cr.data||[]).forEach(c=>cats[c.id]=c.name);
 const rows=(r.data||[]).map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(cats[p.category_id]||'')}</td><td>₹${Number(p.price).toLocaleString('en-IN')}</td><td>${p.stock??0}</td><td>${p.active?'Active':'Hidden'}</td><td><button class="alt" onclick="productForm('${p.id}')">EDIT</button> <button class="alt" onclick="deleteProduct('${p.id}')">DELETE</button></td></tr>`).join('');
 shell(`<div class="card"><button onclick="productForm()">+ ADD PRODUCT</button></div><div class="card"><table><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th>Action</th></tr>${rows||'<tr><td colspan="6">No products found in Supabase.</td></tr>'}</table></div>`)
}
async function productForm(id){let p={name:'',price:0,mrp:0,stock:0,image_url:'',description:'',category:''};if(id){const r=await sb.from('products').select('id,name,price,mrp,stock,image_url,description,categories(name)').eq('id',id).single();if(r.error)return alert(r.error.message);p={...r.data,category:r.data.categories?.name||''}}shell(`<div class="card"><h2>${id?'Edit':'Add'} product</h2><form id="pf" class="form"><input id="pn" placeholder="Product name" value="${esc(p.name)}" required><input id="pc" placeholder="Category name" value="${esc(p.category)}" required><input id="pp" type="number" min="0" placeholder="Selling price" value="${p.price}"><input id="pm" type="number" min="0" placeholder="MRP" value="${p.mrp}"><input id="ps" type="number" min="0" placeholder="Stock" value="${p.stock}"><input id="pi" placeholder="Image URL" value="${esc(p.image_url)}"><textarea id="pd" placeholder="Description">${esc(p.description)}</textarea><button type="submit">${id?'SAVE CHANGES':'PUBLISH'}</button></form><div id="msg" class="msg"></div></div>`);pf.onsubmit=async e=>{e.preventDefault();const category=pc.value.trim();let cr=await sb.from('categories').upsert({name:category,slug:category.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')},{onConflict:'name'}).select('id').single();if(cr.error)return msg.textContent=cr.error.message;const row={name:pn.value.trim(),price:Number(pp.value)||0,mrp:Number(pm.value)||0,stock:Number(ps.value)||0,image_url:pi.value.trim(),description:pd.value.trim(),category_id:cr.data.id,active:true,updated_at:new Date().toISOString()};const r=id?await sb.from('products').update(row).eq('id',id):await sb.from('products').insert(row);if(r.error){msg.className='msg bad';msg.textContent=r.error.message;return}msg.className='msg ok';msg.textContent='Saved to Supabase.';productsPage()}}
async function deleteProduct(id){if(!confirm('Delete this product?'))return;const r=await sb.from('products').update({active:false,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)alert(r.error.message);else productsPage()}
async function ordersPage(){const {data,error}=await sb.from('orders').select('id,order_number,customer_name,total,status,created_at').order('created_at',{ascending:false});if(error)return shell(`<div class="card">${esc(error.message)}</div>`);const rows=(data||[]).map(o=>`<tr><td>${esc(o.order_number)}</td><td>${esc(o.customer_name)}</td><td>₹${Number(o.total).toLocaleString('en-IN')}</td><td><select onchange="setOrder('${o.id}',this.value)">${['Pending','Confirmed','Packed','Shipped','Delivered','Cancelled'].map(v=>`<option ${v===o.status?'selected':''}>${v}</option>`).join('')}</select></td></tr>`).join('');shell(`<div class="card"><table><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th></tr>${rows||'<tr><td colspan=4>No orders.</td></tr>'}</table></div>`)}
async function setOrder(id,status){const r=await sb.from('orders').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)alert(r.error.message)}
async function couponsPage(){const {data,error}=await sb.from('coupons').select('*').order('created_at',{ascending:false});if(error)return shell(`<div class="card">${esc(error.message)}</div>`);const rows=(data||[]).map(c=>`<tr><td>${esc(c.code)}</td><td>₹${c.minimum_order}</td><td>₹${c.discount_amount}</td><td>${c.active?'Active':'Disabled'}</td></tr>`).join('');shell(`<div class="card"><table><tr><th>Code</th><th>Minimum</th><th>Discount</th><th>Status</th></tr>${rows||'<tr><td colspan=4>No coupons.</td></tr>'}</table></div><div class="card"><h3>Add coupon</h3><form id="cf" class="form"><input id="cc" placeholder="Code" required><input id="cm" type="number" placeholder="Minimum order"><input id="co" type="number" placeholder="Discount"><button type="submit">SAVE COUPON</button></form></div>`);cf.onsubmit=async e=>{e.preventDefault();const r=await sb.from('coupons').insert({code:cc.value.trim().toUpperCase(),minimum_order:Number(cm.value)||0,discount_amount:Number(co.value)||0,active:true});if(r.error)alert(r.error.message);else couponsPage()}}
boot();
</script></body></html>
